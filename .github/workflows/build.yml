name: Build
on: workflow_dispatch

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v3
      - name: Build
        run: |
          sudo apt-get install -y g++-mingw-w64-x86-64
          x86_64-w64-mingw32-g++ -static -o app.exe Main.cpp -lgdi32 -lcomctl32 -luser32 -lkernel32 -mwindows -std=c++11
      - uses: actions/upload-artifact@v4
        with:
          name: app
          path: app.exe
