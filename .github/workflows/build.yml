
name: Build CashBook Pro

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: windows-latest
    
    steps:
    - name: Checkout
      uses: actions/checkout@v3
    
    - name: Download MinGW
      run: |
        Invoke-WebRequest -Uri "https://github.com/brechtsanders/winlibs_mingw/releases/download/13.1.0-16.0.5-11.0.0-ucrt-r5/winlibs-x86_64-posix-seh-gcc-13.1.0-llvm-16.0.5-mingw-w64ucrt-11.0.0-r5.7z" -OutFile "mingw.7z"
        7z x mingw.7z -oC:\mingw
      shell: powershell
    
    - name: Add to PATH
      run: echo "C:\mingw\bin" >> $env:GITHUB_PATH
      shell: powershell
    
    - name: Compile
      run: g++ -static -o CashBookPro.exe Main.cpp -lgdi32 -lcomctl32 -luser32 -lkernel32 -mwindows -std=c++11 -O2
      shell: cmd
    
    - name: Upload
      uses: actions/upload-artifact@v3
      with:
        name: CashBookPro-EXE
        path: CashBookPro.exe
