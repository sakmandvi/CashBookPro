name: Build CashBook Pro

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: windows-2022
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
    
    - name: Install MinGW
      run: |
        choco install mingw -y --no-progress
      shell: pwsh
    
    - name: Compile
      run: |
        g++ -static -o CashBookPro.exe Main.cpp -lgdi32 -lcomctl32 -luser32 -lkernel32 -mwindows -std=c++11 -O2 -s
      shell: cmd
    
    - name: Upload Artifact
      uses: actions/upload-artifact@v3
      with:
        name: CashBookPro
        path: CashBookPro.exe
