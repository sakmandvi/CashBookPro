name: Build CashBook Pro EXE
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4
    - name: Compile
      run: |
        mkdir build
        cd build
        echo "Building CashBook Pro..."
        copy ..\Main.cpp Main.cpp
        g++ -static -o CashBookPro.exe Main.cpp -lgdi32 -lcomctl32 -luser32 -lkernel32 -mwindows -std=c++11 -O2
      shell: cmd
    - uses: actions/upload-artifact@v4
      with:
        name: CashBookPro-EXE
        path: build/CashBookPro.exe
